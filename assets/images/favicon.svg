<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
    <defs>
        <style>
            .emerald { fill: #064e3b; }
            .gold { fill: #f59e0b; }
        </style>
    </defs>
    
    <!-- Solid background circle for better visibility on browser tabs -->
    <circle cx="16" cy="16" r="16" class="gold"/>
    
    <!-- Central rice grain element - elongated oval, simplified and larger -->
    <ellipse cx="16" cy="16" rx="4" ry="11" class="emerald"/>
    
    <!-- Left rice grain accent - thicker for visibility -->
    <ellipse cx="10" cy="16" rx="3" ry="9" class="emerald" opacity="0.8"/>
    
    <!-- Right rice grain accent - thicker for visibility -->
    <ellipse cx="22" cy="16" rx="3" ry="9" class="emerald" opacity="0.8"/>
</svg>
